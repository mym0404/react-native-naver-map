name: E2E

on:
  pull_request:
    branches: [main, next]
  push:
    branches: [main, next]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  NAVER_MAP_CLIENT_ID: ${{ vars.NAVER_MAP_CLIENT_ID }}
  E2E_TELEMETRY_DISABLED: '1'

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      E2E_IOS_RUNTIME: com.apple.CoreSimulator.SimRuntime.iOS-18-5
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app
      - uses: ./.github/actions/setup
      - uses: actions/cache@v4
        with:
          path: |
            example/ios/Pods
            ~/.agent-device/apple-runner/derived
          key: e2e-ios-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'example/ios/Podfile.lock') }}
      - name: Build, install, and test
        run: pnpm e2e:ios
      - name: Collect runner diagnostics
        if: ${{ failure() }}
        run: |
          node --input-type=module <<'JS'
          import { cpSync, existsSync, mkdirSync } from 'node:fs';
          import { tmpdir } from 'node:os';
          import path from 'node:path';
          const source = path.join(tmpdir(), 'agent-device/apple-runner/logs');
          if (existsSync(source)) {
            mkdirSync('.e2e/diagnostics/ios', { recursive: true });
            cpSync(source, '.e2e/diagnostics/ios/runner', { recursive: true });
          }
          JS
      - name: Upload results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-ios
          path: |
            .e2e/results/ios
            .e2e/diagnostics/ios
            .e2e/device-state/ios-*/daemon.log
            .e2e/device-state/ios-*/sessions/**/*.ndjson
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: e2e-android-${{ hashFiles('pnpm-lock.yaml', 'example/android/gradle/wrapper/gradle-wrapper.properties') }}
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Boot emulator, build, install, and test
        uses: reactivecircus/android-emulator-runner@v2
        env:
          E2E_DEVICE: emulator-5554
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: pnpm e2e:android
      - name: Upload results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-android
          path: .e2e/results/android
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
